services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: v0
      POSTGRES_USER: v0
      POSTGRES_PASSWORD: v0
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U v0 -d v0"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    env_file: .env
    environment:
      FASTEMBED_CACHE_DIR: /models
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      - models:/models
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./apps/api
    command: python manage.py process_documents
    env_file: .env
    environment:
      FASTEMBED_CACHE_DIR: /models
    volumes:
      - ./apps/api:/app
      - models:/models
    depends_on:
      db:
        condition: service_healthy
    profiles: ["worker"]

volumes:
  pgdata:
  models: